<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faraway Garden</title>
    <meta name="description" content="A cozy Mars farming game for kids, powered by real NASA data. NASA Space Apps 2026." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/ui/viewport.css" />
  </head>
  <body>
    <main id="site">
      <div id="game-toolbar" class="game-toolbar" aria-label="Game display options">
        <label for="view-size">View size</label>
        <select id="view-size" aria-describedby="view-size-help">
          <option value="fit">Fit screen</option>
          <option value="readable">Readable text (1280px)</option>
          <option value="large">Large text (1600px)</option>
        </select>
        <span id="view-size-help">Readable and Large keep game text bigger; use the pan buttons to see the full game.</span>
      </div>
      <div id="pan-controls" hidden aria-label="Pan enlarged game">
        <button id="pan-left" type="button" aria-controls="game-viewport">← Pan left</button>
        <button id="pan-right" type="button" aria-controls="game-viewport">Pan right →</button>
      </div>
      <section id="game-viewport" aria-label="Faraway Garden game">
        <div id="game"></div>
      </section>
      <details id="reading-view">
        <summary>Readable text and controls</summary>
        <div id="reading-content"></div>
      </details>
      <p class="keyboard-hint">Keyboard: use the arrow keys or WASD to move. Press H for help. Touch players can tap the screen.</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
